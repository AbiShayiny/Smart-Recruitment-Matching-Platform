<aside class="sidebar">

  <div class="sidebar-top">

    <div class="brand">
      <div class="brand-logo">
        SR
      </div>

      <div class="brand-name">
        <span>SMART RECRUIT</span>
        <small>MATCHING PLATFORM</small>
      </div>
    </div>

    <nav class="nav-menu">

      <a
        routerLink="/seeker/find-jobs"
        routerLinkActive="active"
        class="nav-item"
      >
        <span>Find Jobs</span>
      </a>

      <a
        routerLink="/seeker/my-applications"
        routerLinkActive="active"
        class="nav-item"
      >
        <span>My Applications</span>
      </a>

      <a
        routerLink="/seeker/my-profile"
        routerLinkActive="active"
        class="nav-item"
      >
        <span>My Profile</span>
      </a>

      <a
        routerLink="/seeker/my-cv"
        routerLinkActive="active"
        class="nav-item"
      >
        <span>My CV</span>
      </a>

      <a
        routerLink="/seeker/contact-requests"
        routerLinkActive="active"
        class="nav-item nav-item-badge"
      >
        <span>Contact Requests</span>

        @if (contactRequestCount > 0) {
          <span class="badge">
            {{ contactRequestCount }}
          </span>
        }
      </a>

      <a
        routerLink="/seeker/notifications"
        routerLinkActive="active"
        class="nav-item"
      >
        <span>Notifications</span>
      </a>

    </nav>

  </div>

  <button
    type="button"
    class="logout-btn"
    (click)="logout()"
  >
    Logout
  </button>

</aside>


<header class="topbar">

  <div class="topbar-right">

    <!-- Notification Bell -->
    <a
      routerLink="/seeker/notifications"
      class="notification"
      aria-label="Notifications"
      title="Notifications"
    >

      <svg
        class="notification-icon"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >

        <path
          d="M18 8C18 6.4087 17.3679 4.88258 16.2426 3.75736C15.1174 2.63214 13.5913 2 12 2C10.4087 2 8.88258 2.63214 7.75736 3.75736C6.63214 4.88258 6 6.4087 6 8C6 15 3 17 3 17H21C21 17 18 15 18 8Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M13.73 21C13.5542 21.3031 13.3019 21.5547 12.9982 21.7295C12.6946 21.9044 12.3504 21.9965 12 21.9965C11.6496 21.9965 11.3054 21.9044 11.0018 21.7295C10.6981 21.5547 10.4458 21.3031 10.27 21"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

      </svg>

      @if (unreadNotifications > 0) {
        <span class="notification-badge">
          {{ unreadNotifications }}
        </span>
      }

    </a>


    <div class="user-profile">

      <div class="avatar">
        D
      </div>

      <div class="user-details">
        <strong>{{ userName }}</strong>
        <small>{{ userRole }}</small>
      </div>

    </div>

  </div>

</header>
