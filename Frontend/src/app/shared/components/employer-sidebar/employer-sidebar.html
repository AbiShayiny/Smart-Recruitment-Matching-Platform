<aside class="fixed inset-y-0 left-0 z-50 flex w-[280px] flex-col border-r border-slate-200 bg-white p-4 text-sm text-slate-700">
  <div class="flex items-center gap-3 px-3 py-4 mb-5">
    <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-orange-500 font-bold text-white">S</div>
    <div><strong class="block text-base text-slate-900">SmartRecruit</strong><span class="text-xs text-slate-400">Employer Portal</span></div>
  </div>
  <nav class="flex flex-col gap-1">
    <a routerLink="/employer/dashboard" routerLinkActive="bg-orange-50 text-orange-600" [routerLinkActiveOptions]="{ exact: true }" class="flex h-11 items-center gap-3 rounded-lg px-3 font-medium hover:bg-slate-50"><svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l9-9 9 9v9H3z"/></svg><span>Dashboard</span></a>
    <a routerLink="/employer/company-profile" routerLinkActive="bg-orange-50 text-orange-600" class="flex h-11 items-center gap-3 rounded-lg px-3 font-medium hover:bg-slate-50"><svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-width="2" d="M4 21V5h16v16M8 9h2m4 0h2M8 13h2m4 0h2"/></svg><span>Company Profile</span></a>
    <a routerLink="/employer/vacancy-list" routerLinkActive="bg-orange-50 text-orange-600" class="flex h-11 items-center gap-3 rounded-lg px-3 font-medium hover:bg-slate-50"><svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="7" width="18" height="13" rx="2" stroke-width="2"/><path stroke-width="2" d="M8 7V4h8v3"/></svg><span>Vacancies</span></a>
    <a routerLink="/applications/applicants-list" routerLinkActive="bg-orange-50 text-orange-600" class="flex h-11 items-center gap-3 rounded-lg px-3 font-medium hover:bg-slate-50"><svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="8" r="3" stroke-width="2"/><path stroke-width="2" d="M3 21v-2a6 6 0 0112 0v2m2-12a3 3 0 010 6"/></svg><span>Applicants</span></a>
    <a routerLink="/contact/contact-requests" routerLinkActive="bg-orange-50 text-orange-600" class="flex h-11 items-center gap-3 rounded-lg px-3 font-medium hover:bg-slate-50"><svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="14" rx="2" stroke-width="2"/><path stroke-width="2" d="M3 7l9 6 9-6"/></svg><span>Contact Requests</span></a>
    <a routerLink="/notifications/notification-list" routerLinkActive="bg-orange-50 text-orange-600" class="flex h-11 items-center gap-3 rounded-lg px-3 font-medium hover:bg-slate-50"><svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-width="2" d="M18 8a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span>Notifications</span></a>
  </nav>
  <button type="button" (click)="signOut()" class="mt-auto flex h-11 w-full items-center gap-3 rounded-lg px-3 font-medium text-slate-600 hover:bg-orange-50 hover:text-orange-600"><svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-width="2" d="M10 17l5-5-5-5m5 5H3m12-9h6v18h-6"/></svg><span>Sign Out</span></button>
</aside>
